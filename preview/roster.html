<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotoAddict · Bike Roster</title>
<style>
  @font-face { font-family: 'Jersey 10'; src: url(../assets/fonts/jersey-10-latin-400-normal.woff2) format('woff2'); }
  :root { color-scheme: dark; }
  body { margin: 0; background: #161a30; color: #fff; font-family: 'Jersey 10', monospace; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-weight: 400; font-size: 34px; margin: 0; }
  p { color: #c2b6d6; font-size: 18px; margin: 4px 0 14px; }
  h2 { font-weight: 400; font-size: 26px; color: #ffd23f; margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .b { background: #0b0e1c; border: 2px solid #3d2b56; border-radius: 6px; padding: 6px 8px; }
  .b img { width: 100%; height: 90px; object-fit: contain; image-rendering: pixelated; background: #1d2340; border-radius: 4px; }
  .nm { font-size: 21px; line-height: 1.1; margin-top: 4px; }
  .s { font-size: 15px; color: #c2b6d6; line-height: 1.15; }
  .pr { font-size: 18px; color: #7ce35b; }
  .est { color: #ffd23f; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Bike roster</h1>
  <p>Every bike in MotoAddict, grouped by the location where it unlocks at the supplier. Cheaper bikes stay available at every location. Prices are US MSRP; yellow notes mark estimates.</p>
  <div id="out"></div>
</main>
<script type="module">
  import { BIKES } from '../src/data/bikes.js';
  import { thumb } from '../src/ui/thumbs.js';
  const out = document.getElementById('out');
  const names = ['Rust Row', 'Millbrook', 'Maple Heights', 'Crestview Hills', 'Gilded Bay'];
  for (let l = 1; l <= 5; l++) {
    const bikes = BIKES.filter((b) => b.loc === l).sort((a, b) => a.price - b.price);
    out.insertAdjacentHTML('beforeend', `<h2>Location ${l} · ${names[l - 1]}</h2><div class="grid">${bikes.map((b) => `
      <div class="b"><img src="${thumb(b.id, 24)}" alt="${b.name}"><div class="nm">${b.brand} ${b.name}</div>
      <div class="s">${b.cc}cc · ${b.hp} hp · ${b.mph} mph</div><div class="s">${b.color}</div>
      <div class="pr">$${b.price.toLocaleString('en-US')}</div>${b.priceNote ? `<div class="est">${b.priceNote}</div>` : ''}</div>`).join('')}</div>`);
  }
  document.body.dataset.ready = '1';
</script>
</body>
</html>
