<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MotoAddict</title>
<meta name="theme-color" content="#14161c">
<style>
  :root { color-scheme: light dark; --bg: #f2f3f6; --ink: #15171c; --muted: #5d6472; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111318; --ink: #eef0f4; --muted: #9aa1ae; --card: #191c22; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 420px; background: var(--card); border-radius: 20px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { display: block; margin-top: 10px; text-align: center; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 700; padding: 14px; border-radius: 14px; }
  a.alt { background: transparent; color: var(--ink); border: 1px solid currentColor; }
</style>
</head>
<body>
  <div class="card">
    <h1>MotoAddict</h1>
    <p>Motorcycle dealership idle tycoon — in development. Phase 1: art style.</p>
    <a href="preview/pixel/">View the chosen pixel style</a>
    <a class="alt" href="preview/">All 5 original art styles</a>
  </div>
</body>
</html>
